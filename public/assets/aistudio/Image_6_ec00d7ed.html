<div class="absolute w-[500px] h-[500px] rounded-full bg-primary-container/15 blur-[120px] pointer-events-none -top-40 -left-40"></div>
<div class="absolute w-[400px] h-[400px] rounded-full bg-secondary-container/10 blur-[100px] pointer-events-none -bottom-20 -right-20"></div>
<div class="w-full max-w-[440px] z-10 my-auto">
<div class="flex items-center justify-between mb-space-lg">
<a class="inline-flex items-center gap-space-xs text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md group" href="/">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span>홈으로 돌아가기</span>
</a>
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-high text-secondary text-label-sm font-label-sm">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
<span>AI 코칭 보안 인증</span>
</div>
</div>
<div class="bg-surface-card rounded-lg p-space-lg md:p-space-xl shadow-xl relative backdrop-blur-md">
<div class="flex flex-col items-center text-center mb-space-xl">
<div class="w-14 h-14 rounded-full bg-primary-container/20 flex items-center justify-center mb-space-md text-primary shadow-sm relative group">
<div class="absolute inset-0 rounded-full bg-primary/20 blur-md opacity-40 group-hover:opacity-75 transition-opacity"></div>
<span class="material-symbols-outlined text-[28px] relative z-10" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-surface tracking-tight mb-space-xs">
          학습 상담 챗봇 로그인
        </h1>
<p class="text-body-sm font-body-sm text-on-surface-variant max-w-[280px]">
          계정에 로그인하여 맞춤형 학습 상담을 이어가세요
        </p>
</div>
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col gap-1.5">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center justify-between" for="userIdentifier">
<span>이메일 / 아이디</span>
<span class="text-label-sm font-label-sm text-secondary hidden" id="identifierHint">형식 확인됨</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px] pointer-events-none transition-colors">mail</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container rounded-full text-on-surface placeholder:text-outline text-body-md font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:bg-surface-elevated transition-all" id="userIdentifier" placeholder="example@email.com" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center justify-between" for="userPassword">
<span>비밀번호</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px] pointer-events-none transition-colors">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container rounded-full text-on-surface placeholder:text-outline text-body-md font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:bg-surface-elevated transition-all" id="userPassword" placeholder="비밀번호를 입력하세요" required="" type="password"/>
<button aria-label="비밀번호 표시 토글" class="absolute right-4 text-outline hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwToggleIcon">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between text-body-sm font-body-sm pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input class="peer sr-only" id="rememberMe" type="checkbox"/>
<div class="w-4 h-4 rounded bg-surface-container flex items-center justify-center text-primary-container peer-checked:bg-primary peer-checked:text-on-primary transition-all group-hover:bg-surface-elevated">
<span class="material-symbols-outlined text-[14px] font-bold opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="text-on-surface-variant text-label-md font-label-md group-hover:text-on-surface transition-colors">로그인 유지</span>
</label>
<div class="flex items-center gap-2 text-label-md font-label-md text-outline">
<a class="hover:text-primary transition-colors" href="#">아이디 찾기</a>
<span>•</span>
<a class="hover:text-primary transition-colors" href="#">비밀번호 찾기</a>
</div>
</div>
<div class="pt-2">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:brightness-110 active:scale-[0.99] transition-all cursor-pointer relative overflow-hidden" id="loginSubmitBtn" type="submit">
<span class="flex items-center gap-1.5" id="btnText">
<span>로그인</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</span>
<span class="hidden" id="btnSpinner">
<svg class="animate-spin h-5 w-5 text-on-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</span>
</button>
</div>
</form>
<div class="my-space-lg flex items-center gap-3">
<div class="h-px bg-surface-container-high flex-1"></div>
<span class="text-label-sm font-label-sm text-outline uppercase tracking-wider">안전한 인공지능 세션</span>
<div class="h-px bg-surface-container-high flex-1"></div>
</div>
<div class="flex items-center justify-center p-3 rounded bg-surface-container-low text-body-sm font-body-sm">
<p class="text-on-surface-variant text-center">
          아직 회원이 아니신가요? 
          <a class="text-primary font-label-md text-label-md ml-1.5 hover:underline inline-flex items-center gap-0.5" href="#">
<span>회원가입하기</span>
<span class="material-symbols-outlined text-[14px]">chevron_right</span>
</a>
</p>
</div>
</div>
<div class="mt-space-lg flex items-center justify-center gap-4 text-label-sm font-label-sm text-outline">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-status-success">verified_user</span>
<span>256비트 종단간 암호화</span>
</div>
<span>•</span>
<span>AI 튜터링 규정 준수</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('userPassword');
    const icon = document.getElementById('pwToggleIcon');
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('loginSubmitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    if (!btn || !btnText || !btnSpinner) return;

    btn.disabled = true;
    btnText.classList.add('hidden');
    btnSpinner.classList.remove('hidden');

    setTimeout(() => {
      btn.disabled = false;
      btnSpinner.classList.add('hidden');
      btnText.classList.remove('hidden');
    }, 1200);
  }

  const idInput = document.getElementById('userIdentifier');
  const idHint = document.getElementById('identifierHint');
  if (idInput && idHint) {
    idInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val.length > 3 && (val.includes('@') || val.length >= 5)) {
        idHint.classList.remove('hidden');
      } else {
        idHint.classList.add('hidden');
      }
    });
  }
</script></main></body></html>
