<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><title>학습 상담 챗봇 - 계정</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

rror":"#ffb4ab"},"borderRadius":{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},"spacing":{"space-lg":"1.5rem","gutter":"1.5rem","margin-mobile":"1.25rem","space-xs":"0.25rem","space-md":"1rem","gutter-mobile":"1rem","space-xl":"2.5rem","space-sm":"0.5rem","margin":"3rem"},"fontFamily":{"body-lg":["Geist"],"body-md":["Geist"],"body-sm":["Geist"],"headline-lg":["Space Grotesk"],"headline-md":["Space Grotesk"],"headline-sm":["Space Grotesk"],"headline-lg-mobile":["Space Grotesk"],"headline-xl-mobile":["Space Grotesk"],"label-md":["Geist"],"label-sm":["Geist"],"headline-xl":["Space Grotesk"],"label-lg":["Geist"]},"fontSize":{"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"body-md":["15px",{"lineHeight":"24px","fontWeight":"400"}],"body-sm":["13px",{"lineHeight":"20px","fontWeight":"400"}],"headline-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"600"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"500"}],"headline-lg-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-xl-mobile":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"700"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.03em","fontWeight":"500"}],"headline-xl":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"600"}]}}}}</script></head><body class="bg-surface font-body-md text-on-surface antialiased"><main class="w-full min-h-screen flex items-center justify-center bg-surface"><div class="flex flex-col w-full items-center justify-center py-10 px-4 sm:px-6 relative overflow-hidden">
<!-- Subtle Ambient Glow Orbs -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Main Card Container -->
<div class="relative w-full max-w-[460px] bg-surface-card rounded-lg shadow-2xl p-8 sm:p-10 flex flex-col z-10">
<!-- Top Meta & Navigation -->
<div class="flex items-center justify-between mb-8">
<a class="inline-flex items-center gap-1.5 text-on-surface-variant hover:text-primary transition-colors text-label-md font-label-md group" href="/">
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:-translate-x-1">arrow_back</span>
<span>메인 홈으로 이동</span>
</a>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-high text-secondary text-label-sm font-label-sm tracking-wide">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
        AI 어드바이저
      </span>
</div>
<!-- Header Section -->
<div class="mb-8">
<div class="flex items-center gap-2 mb-2">
<div class="w-8 h-8 rounded-full bg-primary-container/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]">psychology</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-surface tracking-tight">회원가입</h1>
</div>
<p class="text-on-surface-variant text-body-sm font-body-sm leading-relaxed">
        학습 상담 챗봇과 함께 효율적인 학습을 시작해 보세요
      </p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-5" id="signup-form" onsubmit="event.preventDefault(); handleRegistration();">
<!-- Name / Nickname -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center justify-between" for="name">
<span>이름 / 닉네임</span>
<span class="text-label-sm font-label-sm text-outline">필수</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant text-[20px] pointer-events-none transition-colors">badge</span>
<input class="w-full h-12 bg-surface-container-low text-on-surface text-body-md font-body-md rounded-full pl-11 pr-5 placeholder:text-outline focus:outline-none focus:bg-surface-elevated transition-all duration-200" id="name" name="name" placeholder="홍길동" required="" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center justify-between" for="email">
<span>이메일 주소</span>
<span class="text-label-sm font-label-sm text-outline">아이디로 사용</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant text-[20px] pointer-events-none transition-colors">mail</span>
<input class="w-full h-12 bg-surface-container-low text-on-surface text-body-md font-body-md rounded-full pl-11 pr-5 placeholder:text-outline focus:outline-none focus:bg-surface-elevated transition-all duration-200" id="email" name="email" placeholder="example@email.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center justify-between" for="password">
<span>비밀번호</span>
<span class="text-label-sm font-label-sm text-outline" id="pw-strength-text">보안 강도</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant text-[20px] pointer-events-none transition-colors">lock</span>
<input class="w-full h-12 bg-surface-container-low text-on-surface text-body-md font-body-md rounded-full pl-11 pr-12 placeholder:text-outline focus:outline-none focus:bg-surface-elevated transition-all duration-200" id="password" minlength="8" name="password" oninput="checkPasswordStrength(this.value)" placeholder="영문, 숫자 포함 8자 이상" required="" type="password"/>
<button aria-label="비밀번호 표시 전환" class="absolute right-4 text-outline-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center p-1" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden mt-1 flex gap-1">
<div class="h-full w-1/3 bg-outline-variant/30 rounded-full transition-colors duration-300" id="pw-bar-1"></div>
<div class="h-full w-1/3 bg-outline-variant/30 rounded-full transition-colors duration-300" id="pw-bar-2"></div>
<div class="h-full w-1/3 bg-outline-variant/30 rounded-full transition-colors duration-300" id="pw-bar-3"></div>
</div>
</div>
<!-- Password Confirm -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center justify-between" for="password-confirm">
<span>비밀번호 확인</span>
<span class="text-label-sm font-label-sm text-outline" id="match-status"></span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant text-[20px] pointer-events-none transition-colors">lock_clock</span>
<input class="w-full h-12 bg-surface-container-low text-on-surface text-body-md font-body-md rounded-full pl-11 pr-12 placeholder:text-outline focus:outline-none focus:bg-surface-elevated transition-all duration-200" id="password-confirm" name="passwordConfirm" oninput="validateMatch()" placeholder="비밀번호를 한 번 더 입력하세요" required="" type="password"/>
<button aria-label="비밀번호 확인 표시 전환" class="absolute right-4 text-outline-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center p-1" onclick="togglePasswordVisibility('password-confirm', this)" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Terms & Conditions Agreements -->
<div class="flex flex-col gap-2.5 pt-2">
<label class="relative flex items-start gap-3 cursor-pointer select-none group">
<div class="pt-0.5">
<input class="peer sr-only" id="terms-all" required="" type="checkbox"/>
<div class="w-5 h-5 rounded-md bg-surface-container-high peer-checked:bg-primary-container flex items-center justify-center transition-all duration-200 group-hover:bg-surface-bright">
<span class="material-symbols-outlined text-white text-[15px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="text-body-sm font-body-sm text-on-surface-variant leading-snug">
            [필수] <a class="text-primary hover:underline underline-offset-4" href="#">서비스 이용약관</a> 및 <a class="text-primary hover:underline underline-offset-4" href="#">개인정보 처리방침</a>에 동의합니다.
          </span>
</label>
</div>
<!-- Action Button -->
<button class="w-full h-12 rounded-full bg-primary-container hover:bg-inverse-primary text-white font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-lg transition-all duration-200 active:scale-[0.98] mt-2 group" type="submit">
<span>회원가입 완료</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Sign-in Alternative Link -->
<div class="mt-8 pt-6 bg-surface-container-low/50 -mx-8 -mb-10 sm:-mx-10 sm:-mb-10 p-6 rounded-b-lg flex flex-col items-center justify-center gap-2">
<div class="text-body-sm font-body-sm text-on-surface-variant text-center">
        이미 계정이 있으신가요? 
        <a class="text-primary hover:text-primary-fixed ml-1 font-label-lg text-label-lg hover:underline underline-offset-4 transition-colors" href="/login">
          로그인하기
        </a>
</div>
<div class="flex items-center gap-2 text-outline text-label-sm font-label-sm mt-1">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span>개인 맞춤형 상담 데이터는 암호화되어 안전하게 보호됩니다</span>
</div>
</div>
</div>
<!-- Inline Script for Client-Side Micro-interactions -->
<script>
    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function checkPasswordStrength(val) {
      const bar1 = document.getElementById('pw-bar-1');
      const bar2 = document.getElementById('pw-bar-2');
      const bar3 = document.getElementById('pw-bar-3');
      const text = document.getElementById('pw-strength-text');

      bar1.className = 'h-full w-1/3 rounded-full transition-colors duration-300 bg-outline-variant/30';
      bar2.className = 'h-full w-1/3 rounded-full transition-colors duration-300 bg-outline-variant/30';
      bar3.className = 'h-full w-1/3 rounded-full transition-colors duration-300 bg-outline-variant/30';

      if (!val) {
        text.textContent = '보안 강도';
        text.className = 'text-label-sm font-label-sm text-outline';
        return;
      }

      let strength = 0;
      if (val.length >= 8) strength++;
      if (/[A-Za-z]/.test(val) && /[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val) && val.length >= 10) strength++;

      if (strength === 1) {
        bar1.classList.remove('bg-outline-variant/30');
        bar1.classList.add('bg-status-danger');
        text.textContent = '보안: 취약';
        text.className = 'text-label-sm font-label-sm text-status-danger';
      } else if (strength === 2) {
        bar1.classList.remove('bg-outline-variant/30');
        bar2.classList.remove('bg-outline-variant/30');
        bar1.classList.add('bg-secondary-container');
        bar2.classList.add('bg-secondary-container');
        text.textContent = '보안: 적정';
        text.className = 'text-label-sm font-label-sm text-secondary';
      } else if (strength >= 3) {
        bar1.classList.remove('bg-outline-variant/30');
        bar2.classList.remove('bg-outline-variant/30');
        bar3.classList.remove('bg-outline-variant/30');
        bar1.classList.add('bg-status-success');
        bar2.classList.add('bg-status-success');
        bar3.classList.add('bg-status-success');
        text.textContent = '보안: 안전';
        text.className = 'text-label-sm font-label-sm text-status-success';
      }
      validateMatch();
    }

    function validateMatch() {
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;
      const status = document.getElementById('match-status');

      if (!confirm) {
        status.textContent = '';
        return;
      }

      if (pw === confirm) {
        status.textContent = '일치함';
        status.className = 'text-label-sm font-label-sm text-status-success';
      } else {
        status.textContent = '불일치';
        status.className = 'text-label-sm font-label-sm text-status-danger';
      }
    }

    function handleRegistration() {
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;
      if (pw !== confirm) {
        alert('비밀번호가 일치하지 않습니다. 다시 확인해 주세요.');
        document.getElementById('password-confirm').focus();
        return;
      }
      alert('회원가입이 완료되었습니다! 맞춤형 학습 상담을 시작합니다.');
    }
  </script>
</div></main></body></html>
